// Canonical build definition for normal environments (Gradle + AGP).
// The current build VM cannot run Gradle (Java network egress is blocked),
// so the APK shipped from this VM is produced by build-manual.sh instead —
// same applicationId, manifest, sources and native libs. build-manual.sh
// signs with the debug key by default and with the distribution release
// key when QUANTUS_SIGNING=release (the keystore lives outside this
// repository; see docs/RELEASE.md).
//
// For a Gradle build, stage the two native libraries first (they are not
// in git, see README.md):
//   mkdir -p src/main/jniLibs/arm64-v8a
//   cp native/libquantus_node.so native/libc++_shared.so src/main/jniLibs/arm64-v8a/
plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'app.quantusnode.node'
    compileSdk 35

    defaultConfig {
        applicationId 'app.quantusnode.node'
        minSdk 31
        targetSdk 35
        versionCode 25
        versionName '0.1.5'

        ndk {
            // arm64-v8a only: quantus-node is built for aarch64-linux-android.
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            // debug signing is fine for the MVP
        }
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            // The .so files must be extracted to disk (nativeLibraryDir):
            // libquantus_node.so is executed as a child process by path,
            // which is impossible while it stays inside the APK.
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // The CA bundle lives at the module root (app/assets),
            // where the manual build's aapt2 -A flag expects it.
            // Point Gradle at the same place: without this, a
            // Gradle-built APK ships without cacert.pem and
            // telemetry TLS cannot work (external audit finding 6,
            // versionCode 22).
            assets.srcDirs = ['assets']
            // The native libraries do not live in the default
            // location either: they are staged into
            // src/main/jniLibs/arm64-v8a before a Gradle build (see
            // the header comment). The flat native/ directory the
            // manual build uses cannot be expressed as a jniLibs
            // source set — a jniLibs root must contain ABI-named
            // subdirectories — so the staging directory is named
            // explicitly here and the staging step stays required.
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}
